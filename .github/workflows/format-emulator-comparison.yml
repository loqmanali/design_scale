name: Format emulator comparison

on:
  push:
    branches:
      - test/android-emulator-comparison

permissions:
  contents: write

concurrency:
  group: format-emulator-comparison
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v5
        with:
          ref: test/android-emulator-comparison

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply const cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('example/lib/emulator_comparison_app.dart')
          source = path.read_text()
          old = '''          SizedBox(
            width: 82,
            height: 82,
            child: Stack(
'''
          new = '''          const SizedBox(
            width: 82,
            height: 82,
            child: Stack(
'''
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY

      - name: Format Dart sources
        run: dart format example/lib/emulator_comparison_app.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes are needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add example/lib/emulator_comparison_app.dart
          git commit -m 'style: format Android emulator comparison'
          git push origin HEAD:test/android-emulator-comparison
