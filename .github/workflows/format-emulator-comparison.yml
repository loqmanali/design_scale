name: Format emulator comparison

on:
  push:
    branches:
      - test/android-emulator-comparison

permissions:
  contents: write

concurrency:
  group: format-emulator-comparison
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v5
        with:
          ref: test/android-emulator-comparison

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply const cleanup and format
        run: |
          python3 -c "from pathlib import Path; p=Path('example/lib/emulator_comparison_app.dart'); s=p.read_text(); old='          SizedBox(\n            width: 82,\n            height: 82,\n            child: Stack('; new='          const SizedBox(\n            width: 82,\n            height: 82,\n            child: Stack('; assert old in s; p.write_text(s.replace(old, new, 1))"
          dart format example/lib/emulator_comparison_app.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes are needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add example/lib/emulator_comparison_app.dart
          git commit -m 'style: format Android emulator comparison'
          git push origin HEAD:test/android-emulator-comparison
