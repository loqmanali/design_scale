name: Android simulator comparison

on:
  push:
    branches:
      - test/android-simulator-comparison
    paths-ignore:
      - simulator_screenshots/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-simulator-comparison
  cancel-in-progress: true

jobs:
  capture:
    name: Capture before and after
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v5
        with:
          ref: test/android-simulator-comparison

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Show available disk space
        run: df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -no-metrics
            -camera-back none
          script: bash .github/scripts/capture_android_comparison.sh

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-simulator-before-after
          path: simulator_screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Commit captured screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator_screenshots
          git commit -m 'test: capture Android simulator comparison [skip ci]' || exit 0
          git push origin HEAD:test/android-simulator-comparison
