name: Android emulator before and after

on:
  push:
    branches:
      - test/android-emulator-capture-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-capture-final
  cancel-in-progress: true

jobs:
  build:
    name: Build comparison APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        working-directory: example
        run: |
          flutter create \
            --platforms=android \
            --org dev.designscale \
            --project-name design_scale_example \
            --no-pub \
            .
          flutter pub get

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-design-scale-gradle-v1

      - name: Build baseline and DesignScale APKs
        working-directory: example
        run: |
          mkdir -p ../artifacts/apks

          flutter build apk --debug --target lib/main_before.dart
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/apks/before.apk

          flutter clean
          flutter pub get
          flutter build apk --debug --target lib/main_after.dart
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/apks/after.apk

      - name: Upload comparison APKs
        uses: actions/upload-artifact@v4
        with:
          name: design-scale-comparison-apks
          path: artifacts/apks/*.apk
          if-no-files-found: error
          retention-days: 1

  capture:
    name: Capture Android emulator screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download comparison APKs
        uses: actions/download-artifact@v4
        with:
          name: design-scale-comparison-apks
          path: artifacts/apks

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          docker system prune --all --force || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: bash .github/scripts/capture_android_comparison.sh

      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-scale-android-emulator-comparison
          path: artifacts/emulator
          if-no-files-found: warn
          retention-days: 7
