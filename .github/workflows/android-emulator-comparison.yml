name: Android emulator before and after

on:
  push:
    branches:
      - test/android-emulator-comparison
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Android emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          docker system prune --all --force || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android host project
        working-directory: example
        run: |
          flutter create \
            --platforms=android \
            --org dev.designscale \
            --project-name design_scale_example \
            --no-pub \
            .
          flutter pub get

      - name: Build baseline and DesignScale APKs
        working-directory: example
        run: |
          mkdir -p ../artifacts/apks ../artifacts/emulator

          flutter build apk --debug --target lib/main_before.dart
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/apks/before.apk

          flutter clean
          flutter pub get
          flutter build apk --debug --target lib/main_after.dart
          cp build/app/outputs/flutter-apk/app-debug.apk ../artifacts/apks/after.apk

      - name: Reclaim build tools before emulator
        run: |
          rm -rf example/build example/.dart_tool
          rm -rf "$FLUTTER_ROOT"
          rm -rf "$PUB_CACHE"
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists"
          df -h /

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: sh .github/scripts/capture_android_comparison.sh

      - name: Upload comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: design-scale-android-emulator-comparison
          path: artifacts/emulator
          if-no-files-found: error
          retention-days: 7
