name: Fix emulator comparison const contexts

on:
  push:
    branches:
      - test/android-emulator-comparison

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@v5
        with:
          ref: test/android-emulator-comparison

      - name: Normalize const contexts
        run: |
          python3 -c "from pathlib import Path; p=Path('example/lib/emulator_comparison_app.dart'); s=p.read_text(); a='      child: Row(\n        children: [\n          const Expanded('; b='      child: const Row(\n        children: [\n          Expanded('; c='          const SizedBox(width: 16),\n          const SizedBox(\n            width: 82,'; d='          SizedBox(width: 16),\n          SizedBox(\n            width: 82,'; e='                const CircularProgressIndicator('; f='                CircularProgressIndicator('; g='                const Icon(\n                  Icons.trending_up_rounded,'; h='                Icon(\n                  Icons.trending_up_rounded,'; assert all(x in s for x in (a,c,e,g)); p.write_text(s.replace(a,b,1).replace(c,d,1).replace(e,f,1).replace(g,h,1))"

      - name: Commit const cleanup
        run: |
          if git diff --quiet; then
            echo 'No const cleanup is needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add example/lib/emulator_comparison_app.dart
          git commit -m 'fix: normalize const contexts in emulator comparison'
          git push origin HEAD:test/android-emulator-comparison
